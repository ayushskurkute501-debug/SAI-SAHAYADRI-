spring.application.name=sai-sahayadri-academy
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sai_sahayadri}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.thymeleaf.cache=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.servlet.session.timeout=30m
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=17MB
academy.materials.directory=${ACADEMY_MATERIALS_DIRECTORY:./data/materials}
